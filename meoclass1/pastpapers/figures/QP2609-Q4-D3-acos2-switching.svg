<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">QP2609 Q4 - D3: ACOS2 automated cylinder oil switching - two documented layouts (Everllence B&amp;W, standard)</title>
  <desc id="d">Two separate maker layouts, drawn apart and not combined. Arrangement A, project guide section 9.01, Fig. 9.01.01, all engines: low-BN and high-BN tanks feed a pneumatically actuated three-way L-bored ball valve with spring return to the high-BN position; the symbol shows no valve position. A 3/2 solenoid valve admits compressed air; the engine control system sends command XC8260 and reads position feedback ZS8261 (low BN) and ZS8262 (high BN). The selected oil passes an optional flow meter with a bypass and a filter into the cylinder oil heating tank, with heater, temperature indicator and low-level alarm; it leaves through an outlet valve and an insulated, heat-traced pipe to the single engine inlet AC. Arrangement B, section 9.02, Figs. 9.02.02a and 9.02.04a, 95-60ME-GI/-LGI engines: each oil has its own service tank, filter and small heated tank, and its own heat-traced pipe to the engine - low BN to inlet AC1, high BN to AC2 - where the ACOS valve on the engine selects one oil for the main cylinder oil pipe; the maker marks this "ACOS (not SDF)", and with ACOM (SDF) the engine has one inlet AC. Control modes are Auto, High BN and Low BN, with optional Max. and Force timers; in Auto the engine control system selects automatically between the two grades according to the engine's control configuration; the maker's Auto-mode switching rule is not reproduced.</desc>
