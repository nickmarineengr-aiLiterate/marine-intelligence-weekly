<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">QP2609 Q4 - D3: ACOS2 automated cylinder oil switching system (Everllence B&amp;W, standard)</title>
  <desc id="d">Two separate cylinder-oil tanks, low BN and high BN, feed a pneumatically actuated three-way L-bored ball valve with spring return to the high-BN position; the symbol shows no valve position. A 3/2 solenoid valve admits control air; the engine control system sends command XC8260 and reads position feedback ZS8261 (low BN) and ZS8262 (high BN). The selected oil passes an optional flow meter with a bypass and a filter to the cylinder oil heating tank, with heater, temperature indicator and low-level alarm, and on to engine inlet AC. Control modes are Auto, High BN and Low BN, with optional Max. and Force timers. In Auto the engine control system selects automatically between the two grades according to the engine's control configuration; the maker's Auto-mode switching rule is not reproduced.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b3a5c"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b35900"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker></defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">Q4 - D3  ACOS2 - automated cylinder oil SWITCHING (standard on most Everllence B&amp;W engines)</text>
  <text x="20" y="49" fill="#555">Selects ONE of two oils. It does not blend. Traced to project guide section 9.01, Fig. 9.01.01 and item 5 "Automatic cylinder oil switch - ACOS2".</text>
  <rect x="40" y="80" width="220" height="60" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="50" y="100" font-weight="bold" fill="#111">Low-BN cylinder oil</text>
  <text x="50" y="118" font-size="12" fill="#555">storage and/or service tank</text>
  <rect x="40" y="250" width="220" height="60" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="50" y="270" font-weight="bold" fill="#111">High-BN cylinder oil</text>
  <text x="50" y="288" font-size="12" fill="#555">storage and/or service tank</text>
  <path d="M260 110 H380 V178" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M260 280 H380 V222" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 200 L389 182 L371 182 Z" fill="#fff" stroke="#1b3a5c" stroke-width="2"/>
  <path d="M380 200 L371 218 L389 218 Z" fill="#fff" stroke="#1b3a5c" stroke-width="2"/>
  <path d="M380 200 L398 209 L398 191 Z" fill="#fff" stroke="#1b3a5c" stroke-width="2"/>
  <text x="276" y="192" font-size="11" fill="#555">3-way ball valve</text>
  <text x="276" y="205" font-size="11" fill="#555">(L-bored);</text>
  <text x="276" y="218" font-size="11" fill="#555">position not shown</text>
  <path d="M398 200 H520" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="335" y="330" width="200" height="64" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="345" y="350" font-size="12" font-weight="bold" fill="#111">Pneumatic actuator</text>
  <text x="345" y="368" font-size="11" fill="#555">single-acting; spring return</text>
  <text x="345" y="384" font-size="11" fill="#555">to "High BN cylinder oil"</text>
  <path d="M470 330 V250 L396 213" fill="none" stroke="#b35900" stroke-width="2.5"/>
  <text x="478" y="262" font-size="11" fill="#b35900">actuator linkage</text>
  <rect x="335" y="420" width="200" height="50" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="345" y="440" font-size="12" font-weight="bold" fill="#111">3/2 solenoid valve</text>
  <text x="345" y="458" font-size="11" fill="#555">with silencer; control air</text>
  <path d="M435 420 V396" fill="none" stroke="#b35900" stroke-width="2" marker-end="url(#ac)"/>
  <rect x="40" y="470" width="240" height="110" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="50" y="490" font-weight="bold" fill="#111">Engine control system</text>
  <text x="50" y="508" font-size="12" fill="#555">XC8260 command, 24 V DC</text>
  <text x="50" y="524" font-size="12" fill="#555">(closed contact = Low BN)</text>
  <text x="50" y="540" font-size="12" fill="#555">ZS8261 feedback: Low BN</text>
  <text x="50" y="556" font-size="12" fill="#555">ZS8262 feedback: High BN</text>
  <path d="M280 490 H320 V445 H333" fill="none" stroke="#b35900" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <path d="M333 370 H300 V540 H282" fill="none" stroke="#b35900" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ac)"/>
  <rect x="520" y="175" width="150" height="50" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="530" y="195" font-size="12" font-weight="bold" fill="#111">Flow meter</text>
  <text x="530" y="213" font-size="11" fill="#555">(optional; bypass)</text>
  <path d="M670 200 H700" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="700" y="175" width="110" height="50" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="710" y="195" font-size="12" font-weight="bold" fill="#111">Filter</text>
  <path d="M810 200 H835" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="835" y="160" width="145" height="96" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="845" y="180" font-size="12" font-weight="bold" fill="#111">Heating tank</text>
  <text x="845" y="198" font-size="11" fill="#555">heater (45 C set</text>
  <text x="845" y="214" font-size="11" fill="#555">point); TI; low-level</text>
  <text x="845" y="230" font-size="11" fill="#555">alarm LS 8212; then</text>
  <text x="845" y="246" font-size="11" fill="#555">heat-traced to AC</text>
  <rect x="580" y="290" width="400" height="150" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="590" y="310" font-weight="bold" fill="#111">Control modes (ECS)</text>
  <text x="590" y="328" font-size="12" fill="#555">Auto - automatic selection between the two grades,</text>
  <text x="590" y="344" font-size="12" fill="#555">  per the engine-control configuration (rule *)</text>
  <text x="590" y="360" font-size="12" fill="#555">High BN - high-BN oil only;  Low BN - low-BN oil only</text>
  <text x="590" y="376" font-size="12" fill="#555">Optional timers "Max." and "Force" end low-BN periods</text>
  <text x="590" y="392" font-size="12" fill="#555">(days and feed-rate thresholds) - cylinder cleanliness</text>
  <text x="590" y="408" font-size="12" fill="#555">Factors listed by the maker: load; pilot-fuel amount</text>
  <text x="590" y="424" font-size="12" fill="#555">  and sulphur (DF).  * Auto-mode rule not reproduced</text>
  <rect x="580" y="460" width="400" height="120" rx="6" fill="#fff4e5" stroke="#b35900" stroke-width="2"/>
  <text x="590" y="480" font-weight="bold" fill="#111">Maker limitation</text>
  <text x="590" y="498" font-size="12" fill="#555">"a simple system securing fully acceptable conditions</text>
  <text x="590" y="514" font-size="12" fill="#555">when a longer changeover period is available"</text>
  <text x="590" y="530" font-size="12" fill="#555">For a faster-responding change: ACOM (option) - D4.</text>
  <text x="590" y="546" font-size="12" fill="#555">Variant: Figs. 9.02.01 / 9.02.02a - ACOS behind AC1 / AC2,</text>
  <text x="590" y="562" font-size="12" fill="#555">two heating tanks; Fig. 9.02.04a "ACOS (not SDF)".</text>
  <text x="20" y="610" font-size="11" fill="#555">Source: Everllence project guide G95ME-C10.5-GI, 7020-0260-14ppr rev 1.0 (July 2026), section 9.01: Fig. 9.01.01,</text>
  <text x="20" y="626" font-size="11" fill="#555">Table 9.01.03, the ACOS2 control-mode table and item 5 "Automatic cylinder oil switch - ACOS2"; section 9.02: Figs. 9.02.01, 9.02.02a, 9.02.04a.</text>
</svg>
