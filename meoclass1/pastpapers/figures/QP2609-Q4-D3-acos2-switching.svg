  <text x="50" y="740" font-weight="bold" fill="#111">Control modes (ECS)</text>
  <text x="50" y="758" font-size="12" fill="#555">Auto - automatic selection between the two grades,</text>
  <text x="50" y="774" font-size="12" fill="#555">  per the engine-control configuration (rule *)</text>
  <text x="50" y="790" font-size="12" fill="#555">High BN - high-BN oil only;  Low BN - low-BN oil only</text>
  <text x="50" y="806" font-size="12" fill="#555">Optional timers "Max." and "Force" end low-BN periods</text>
  <text x="50" y="822" font-size="12" fill="#555">(days and feed-rate thresholds) - cylinder cleanliness</text>
  <text x="50" y="838" font-size="12" fill="#555">Factors listed by the maker: load; pilot-fuel amount</text>
  <text x="50" y="854" font-size="12" fill="#555">  and sulphur (DF).  * Auto-mode rule not reproduced</text>
  <rect x="520" y="720" width="460" height="150" rx="6" fill="#fff4e5" stroke="#b35900" stroke-width="2"/>
  <text x="530" y="740" font-weight="bold" fill="#111">Maker limitation</text>
  <text x="530" y="758" font-size="12" fill="#555">"a simple system securing fully acceptable conditions</text>
  <text x="530" y="774" font-size="12" fill="#555">when a longer changeover period is available"</text>
  <text x="530" y="790" font-size="12" fill="#555">For a faster-responding change: ACOM (option) - D4.</text>
  <text x="530" y="806" font-size="12" fill="#555">Fail-safe: spring returns the valve to HIGH-BN oil.</text>
  <text x="530" y="822" font-size="12" fill="#555">Standard for LS, HS and HS Tier II / LS Tier III</text>
  <text x="530" y="838" font-size="12" fill="#555">engines (Table 9.01.03).</text>
