  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">Q4 - D3  ACOS2 - automated cylinder oil SWITCHING: two documented layouts (Everllence B&amp;W)</text>
  <text x="20" y="49" fill="#555">Selects ONE of two oils; it does not blend. A and B are separate maker figures - drawn apart, not combined. Functional line diagram, not to scale.</text>
