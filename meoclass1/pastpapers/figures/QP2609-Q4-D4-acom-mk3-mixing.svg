  <path d="M399 587 l10 -6" stroke="#c62828" stroke-width="1.5"/>
  <path d="M387 511 L403 511 L387 529 L403 529 Z" fill="#fff" stroke="#1b3a5c" stroke-width="2"/>
  <text x="418" y="545" font-size="12" fill="#555">outlet valve;</text>
  <text x="418" y="560" font-size="12" fill="#555">heat-traced pipe</text>
  <text x="418" y="604" font-size="12" font-weight="bold" fill="#111">to engine inlet AC (D1, D2)</text>
  <rect x="760" y="430" width="190" height="50" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="770" y="450" font-size="12" font-weight="bold" fill="#111">Electrical cabinet</text>
  <text x="770" y="468" font-size="11" fill="#555">ECS-controlled ACOM</text>
  <rect x="40" y="520" width="290" height="120" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="50" y="540" font-weight="bold" fill="#111">Control</text>
  <text x="50" y="558" font-size="12" fill="#555">Auto: ECS calculates the ordered BN from</text>
  <text x="50" y="574" font-size="12" fill="#555">fuel sulphur (DF: the "sulphur</text>
  <text x="50" y="590" font-size="12" fill="#555">equivalent" from load, pilot-fuel amount</text>
  <text x="50" y="606" font-size="12" fill="#555">and pilot sulphur entered on MOP)</text>
  <text x="50" y="622" font-size="12" fill="#555">Manual: operator enters ordered BN</text>
  <rect x="640" y="520" width="340" height="120" rx="6" fill="#fff4e5" stroke="#b35900" stroke-width="2"/>
  <text x="650" y="540" font-weight="bold" fill="#111">Status and current use</text>
  <text x="650" y="558" font-size="12" fill="#555">option on HS and HS Tier II / LS Tier III;</text>
  <text x="650" y="574" font-size="12" fill="#555">not applicable to LS-only engines (Table 9.01.03)</text>
  <text x="650" y="590" font-size="12" fill="#555">SL2023-737: mixing "no longer recommended" for</text>
  <text x="650" y="606" font-size="12" fill="#555">low-S fuel (Cat. II BN 40 instead); still listed</text>
  <text x="650" y="622" font-size="12" fill="#555">for HSFO, e.g. Cat. II BN 40 + BN 100/140+</text>
  <text x="20" y="670" font-size="11" fill="#555">Sources: Everllence project guide G95ME-C10.5-GI, 7020-0260-14ppr rev 1.0 (July 2026), section 9.01 (Option 2; Fig. 9.01.02; Fig. 9.01.04); MAN SL2023-737 (June 2023) section 3.</text>
  <text x="20" y="686" font-size="11" fill="#555">Pump control law and bypass-valve duty are not published and are not asserted. ACOM replaces the two service tanks and the heating tank of the ACOS2 layout.</text>
</svg>
