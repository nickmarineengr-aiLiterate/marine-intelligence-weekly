  <text x="418" y="452" font-size="12" fill="#555">mixing-tank pump loop;</text>
  <text x="418" y="467" font-size="12" fill="#555">bypass valve normally closed</text>
  <path d="M395 312 V352 a8 8 0 0 0 0 16 V600" fill="none" stroke="#1b3a5c" stroke-width="2"/>
  <path d="M399 506 l10 -6" stroke="#c62828" stroke-width="1.5"/>
  <path d="M399 515 l10 -6" stroke="#c62828" stroke-width="1.5"/>
