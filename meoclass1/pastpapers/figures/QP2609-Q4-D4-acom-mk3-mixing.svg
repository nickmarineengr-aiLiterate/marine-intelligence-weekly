<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">QP2609 Q4 - D4: ACOM Mk III automated cylinder oil mixing system (Everllence B&amp;W, option)</title>
  <desc id="d">Low-BN and high-BN cylinder oils flow by gravity from their storage or service tanks into the ACOM Mk III unit: a low-BN oil tank and a high-BN oil tank, each heated and fitted with temperature and low-level monitoring, each with a motor-driven pump, relief valve and motor-operated valve feeding a common line into a BN mixing tank with level transmitter, level alarm and temperature monitoring and its own pump loop with a normally closed bypass valve. The mixed oil leaves through a heat-traced pipe to engine inlet AC. An electrical cabinet controlled by the engine control system sets the ordered BN.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b3a5c"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b35900"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker></defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">Q4 - D4  ACOM Mk III - automated cylinder oil MIXING (option; high-sulphur-fuel engines)</text>
  <text x="20" y="49" fill="#555">Mixes TWO fully formulated cylinder oils to an ordered BN between them. Simplified from project guide Fig. 9.01.02 ("ACOM Mk.III"); instruments as labelled there.</text>
  <rect x="40" y="75" width="220" height="58" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="50" y="95" font-weight="bold" fill="#111">Low-BN cylinder oil</text>
  <text x="50" y="113" font-size="12" fill="#555">storage and/or service tank</text>
  <rect x="740" y="75" width="220" height="58" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="750" y="95" font-weight="bold" fill="#111">High-BN cylinder oil</text>
  <text x="750" y="113" font-size="12" fill="#555">storage and/or service tank</text>
  <text x="420" y="100" font-size="12" fill="#555">gravity feed</text>
  <rect x="30" y="160" width="940" height="330" rx="8" fill="none" stroke="#1b3a5c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="44" y="182" font-weight="bold" fill="#111">ACOM Mk III unit</text>
  <path d="M150 133 V218" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M850 133 V218" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="70" y="220" width="250" height="92" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="80" y="240" font-weight="bold" fill="#111">Low-BN oil tank 1</text>
  <text x="80" y="258" font-size="12" fill="#555">heater (45 C set point)</text>
  <text x="80" y="274" font-size="12" fill="#555">temperature (TT), level alarm (LAL)</text>
  <text x="80" y="290" font-size="12" fill="#555">air vent; sample and drain</text>
  <rect x="680" y="220" width="250" height="92" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="690" y="240" font-weight="bold" fill="#111">High-BN oil tank 2</text>
  <text x="690" y="258" font-size="12" fill="#555">heater (45 C set point)</text>
  <text x="690" y="274" font-size="12" fill="#555">temperature (TT), level alarm (LAL)</text>
  <text x="690" y="290" font-size="12" fill="#555">air vent; sample and drain</text>
  <rect x="375" y="220" width="250" height="92" rx="6" fill="#eaf0fb" stroke="#1b3a5c" stroke-width="2"/>
  <text x="385" y="240" font-weight="bold" fill="#111">BN mixing tank</text>
  <text x="385" y="258" font-size="12" fill="#555">level transmitter (LT), level alarm</text>
  <text x="385" y="274" font-size="12" fill="#555">(LAL), temperature (TT);</text>
  <text x="385" y="290" font-size="12" fill="#555">small volume - fast BN change</text>
  <circle cx="150" cy="360" r="13" fill="#fff" stroke="#1b3a5c" stroke-width="2"/>
