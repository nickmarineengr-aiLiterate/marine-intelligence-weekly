  <path d="M731 352 L731 368 L749 352 L749 368 Z" fill="#fff" stroke="#1b3a5c" stroke-width="2"/>
  <path d="M330 360 H420 V314" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M670 360 H580 V314" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <text x="90" y="400" font-size="12" fill="#555">motor-driven pump, relief valve</text>
  <text x="90" y="415" font-size="12" fill="#555">back to tank; motor-operated valve</text>
  <text x="655" y="400" font-size="12" fill="#555">motor-driven pump, relief valve</text>
  <text x="655" y="415" font-size="12" fill="#555">back to tank; motor-operated valve</text>
  <circle cx="500" cy="420" r="13" fill="#fff" stroke="#1b3a5c" stroke-width="2"/>
  <path d="M493.5 409.6 L513 420 L493.5 430.4" fill="none" stroke="#1b3a5c" stroke-width="2"/>
