<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>QP2609 Q3 - Hull form optimisation: forebody, aft-body and twin skeg (generic schematic, not to scale)</title>
  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Q3 - Hull form optimisation: where each measure acts (generic schematic, not to scale)</text>
  <text x="20" y="48" fill="#555">Concepts as stated in the verified answer (donor QP2402-Q3). No saving is quantified - savings are design- and route-specific.</text>

  <!-- profile -->
  <text x="20" y="80" font-weight="bold">A. Side profile</text>
  <line x1="40" y1="170" x2="900" y2="170" stroke="#4a90c2" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="20" y="162" fill="#4a90c2" font-size="11">WL</text>
  <path d="M150 110 L790 110 L840 150 C846 170 846 190 832 206 L810 230 L200 230 C170 228 150 215 140 195 L118 190 C92 189 80 178 80 170 C80 160 94 150 118 150 L140 146 Z"
        fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <!-- bulb emphasis -->
  <ellipse cx="104" cy="170" rx="26" ry="16" fill="#dbe8f4" stroke="#1b3a5c" stroke-width="1.5"/>
  <!-- propeller and rudder at stern (right) -->
  <line x1="822" y1="198" x2="846" y2="198" stroke="#333" stroke-width="2"/>
  <ellipse cx="850" cy="198" rx="5" ry="22" fill="#b35900"/>
  <rect x="866" y="172" width="8" height="50" fill="#555"/>
  <!-- flow arrows into propeller -->
  <g stroke="#2e7d32" stroke-width="1.6" fill="none">
    <path d="M700 238 C760 236 800 222 838 206"/><path d="M830 204 L838 206 L834 213"/>
    <path d="M700 250 C770 250 805 238 840 214"/>
  </g>
  <!-- labels profile -->
  <text x="40" y="262" font-weight="bold" fill="#1b3a5c">FOREBODY</text>
  <text x="40" y="280" font-size="12">bulbous bow: volume, length, shape, height;</text>
  <text x="40" y="296" font-size="12">waterline entrance angle; shoulder fairing</text>
  <text x="40" y="312" font-size="12">acts on WAVE-MAKING resistance - bulb wave in</text>
  <text x="40" y="328" font-size="12">antiphase with bow wave, tuned to one speed/draught</text>
  <text x="40" y="344" font-size="12" fill="#b30000">off-design (ballast, slow steaming) it can ADD resistance</text>
  <text x="600" y="262" font-weight="bold" fill="#1b3a5c">AFT-BODY</text>
  <text x="600" y="280" font-size="12">buttock lines, U/V sections, stern bulb,</text>
  <text x="600" y="296" font-size="12">skeg/bossing, propeller aperture and clearances</text>
  <text x="600" y="312" font-size="12">acts on the WAKE delivered to the propeller:</text>
  <text x="600" y="328" font-size="12">more uniform inflow = less cavitation, vibration;</text>
  <text x="600" y="344" font-size="12">better hull efficiency (wake vs thrust deduction)</text>
  <text x="330" y="175" font-size="12" fill="#555">frictional resistance - wetted surface and roughness</text>

  <!-- sections -->
  <text x="20" y="392" font-weight="bold">B. Stern sections looking forward</text>
  <!-- single screw -->
  <path d="M90 420 L290 420 L290 470 C290 520 230 555 190 560 C150 555 90 520 90 470 Z" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <circle cx="190" cy="530" r="26" fill="none" stroke="#b35900" stroke-width="3"/>
  <text x="90" y="585" font-size="12">single screw on centreline - diameter limited by draught</text>
  <!-- twin skeg -->
  <path d="M470 420 L770 420 L770 470 C770 490 752 500 740 505 L725 560 L690 560 L680 505 C650 498 590 498 560 505 L550 560 L515 560 L500 505 C488 500 470 490 470 470 Z"
        fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <circle cx="533" cy="535" r="22" fill="none" stroke="#b35900" stroke-width="3"/>
  <circle cx="707" cy="535" r="22" fill="none" stroke="#b35900" stroke-width="3"/>
  <text x="470" y="585" font-size="12">twin skeg - two skegs, two shafts; circles = propeller discs aft of each skeg</text>
  <text x="790" y="440" font-size="12" fill="#2e7d32">+ larger total disc area,</text>
  <text x="790" y="456" font-size="12" fill="#2e7d32">  lower rpm, cleaner inflow</text>
  <text x="790" y="480" font-size="12" fill="#b30000">- more wetted surface</text>
  <text x="790" y="496" font-size="12" fill="#b30000">  (friction), 2 x machinery</text>
  <text x="790" y="520" font-size="12">net gain where Cb high,</text>
  <text x="790" y="536" font-size="12">beam large, draught limited</text>
</svg>
