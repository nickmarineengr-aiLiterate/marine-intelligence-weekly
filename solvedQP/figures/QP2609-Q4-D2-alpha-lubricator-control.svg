<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">QP2609 Q4 - D2: Alpha lubricator control - functional block diagram (Everllence B&amp;W ME engines)</title>
  <desc id="d">Functional block diagram. The main operating panel supplies settings and the fuel or pilot-fuel sulphur figure; the cylinder control unit of the engine control system uses engine speed and fuel index to set injection frequency and dosage. It commands the lubricator control valve - a solenoid valve on the Alpha/ME lubricator or a proportional valve on the Alpha Mk 2 - which admits hydraulic system oil from the hydraulic cylinder unit to drive small multi-piston pumps. They deliver cylinder oil through non-return valves to the lubricating quills. A feedback sensor reports back to the control unit; a level switch monitors the oil supply. The internal porting is not published by the maker and is not drawn.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b3a5c"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b35900"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker></defs>
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">Q4 - D2  Alpha lubricator: control and actuation (functional block diagram)</text>
  <rect x="20" y="40" width="960" height="30" rx="4" fill="#fff4e5" stroke="#b35900"/>
  <text x="32" y="60" font-weight="bold" fill="#7a3d00">FUNCTIONAL BLOCKS, NOT PIPEWORK: the maker does not publish the lubricator's internal hydraulic porting, so none is drawn.</text>
  <rect x="25" y="95" width="250" height="108" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="35" y="115" font-weight="bold" fill="#111">Main operating panel (MOP)</text>
  <text x="35" y="133" font-size="12" fill="#555">fuel / pilot-fuel sulphur % (entered)</text>
  <text x="35" y="149" font-size="12" fill="#555">feed-rate factor (HSFO only)</text>
  <text x="35" y="165" font-size="12" fill="#555">minimum feed-rate setting</text>
  <text x="35" y="181" font-size="12" fill="#555">pre-lubrication; running-in increase</text>
  <rect x="25" y="230" width="250" height="70" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="35" y="250" font-weight="bold" fill="#111">Engine signals</text>
  <text x="35" y="268" font-size="12" fill="#555">engine speed (tacho signal)</text>
  <text x="35" y="284" font-size="12" fill="#555">fuel index</text>
  <rect x="335" y="140" width="250" height="120" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="345" y="160" font-weight="bold" fill="#111">Cylinder Control Unit (CCU)</text>
  <text x="345" y="178" font-size="12" fill="#555">one per cylinder, part of the ME-ECS</text>
  <text x="345" y="194" font-size="12" fill="#555">sets injection frequency and dose</text>
  <text x="345" y="210" font-size="12" fill="#555">from speed, fuel index and settings</text>
  <text x="345" y="226" font-size="12" fill="#555">part-load: load above breakpoint,</text>
  <text x="345" y="242" font-size="12" fill="#555">engine speed below it</text>
  <path d="M275 150 H333" fill="none" stroke="#b35900" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <path d="M275 265 H305 V230 H333" fill="none" stroke="#b35900" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <rect x="640" y="95" width="335" height="330" rx="8" fill="none" stroke="#1b3a5c" stroke-width="2.5"/>
  <text x="652" y="116" font-weight="bold" fill="#111">Alpha lubricator (on the cylinder's HCU)</text>
  <rect x="655" y="130" width="305" height="62" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="665" y="150" font-weight="bold" fill="#111">Control valve</text>
  <text x="665" y="168" font-size="12" fill="#555">solenoid valve - Alpha/ME lubricator</text>
  <text x="665" y="184" font-size="12" fill="#555">proportional valve - Alpha Mk 2</text>
  <rect x="655" y="208" width="305" height="64" rx="6" fill="#e8f3e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="228" font-weight="bold" fill="#111">Hydraulic actuation</text>
  <text x="665" y="246" font-size="12" fill="#555">engine system oil from the HCU;</text>
  <text x="665" y="262" font-size="12" fill="#555">stroke activated by the control valve</text>
  <rect x="655" y="286" width="305" height="48" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="665" y="306" font-weight="bold" fill="#111">Small multi-piston pumps</text>
  <text x="665" y="324" font-size="12" fill="#555">pressurise the cylinder oil to the quills</text>
  <rect x="655" y="356" width="145" height="56" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="665" y="376" font-size="12" font-weight="bold" fill="#111">Feedback sensor</text>
  <text x="665" y="394" font-size="11" fill="#555">(inductive, Mk 2)</text>
  <rect x="815" y="356" width="145" height="56" rx="6" fill="#fdf1e6" stroke="#b35900" stroke-width="2"/>
  <text x="825" y="376" font-size="12" font-weight="bold" fill="#111">Level switch</text>
  <text x="825" y="394" font-size="11" fill="#555">cylinder-oil supply</text>
  <path d="M585 170 H653" fill="none" stroke="#b35900" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <text x="592" y="162" font-size="12" fill="#b35900">command</text>
  <path d="M655 384 H610 V240 H587" fill="none" stroke="#b35900" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#ac)"/>
  <text x="552" y="300" font-size="12" fill="#b35900">feedback</text>
  <path d="M807 192 V206" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M807 272 V284" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="655" y="460" width="305" height="60" rx="6" fill="#e8f3e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="480" font-weight="bold" fill="#111">Hydraulic Cylinder Unit (HCU)</text>
  <text x="665" y="498" font-size="12" fill="#555">one per cylinder; fed with 300 bar system oil</text>
  <text x="665" y="514" font-size="12" fill="#555">from the hydraulic power supply</text>
  <path d="M720 458 V427" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="335" y="460" width="250" height="60" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="345" y="480" font-weight="bold" fill="#111">Cylinder oil main pipe</text>
  <text x="345" y="498" font-size="12" fill="#555">from heating tank / ACOM via AC (D1, D3, D4)</text>
  <path d="M585 490 H630 V320 H653" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="335" y="560" width="640" height="64" rx="6" fill="#eef3f8" stroke="#1b3a5c" stroke-width="2"/>
  <text x="345" y="580" font-weight="bold" fill="#111">Lubricating quills — number depends on engine type; arrangement illustrative</text>
  <text x="345" y="598" font-size="12" fill="#555">each with a non-return valve; oil enters as the piston rings pass the orifices on the upstroke,</text>
  <text x="345" y="614" font-size="12" fill="#555">intermittently (e.g. every 2, 4 or 8 revolutions). Alpha Mk 2: one or several timed injections per revolution.</text>
  <path d="M960 334 H985 V592 H977" fill="none" stroke="#1b3a5c" stroke-width="2" marker-end="url(#a)"/>
  <rect x="25" y="340" width="290" height="180" rx="6" fill="#f6f6f6" stroke="#777" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="35" y="360" font-weight="bold" fill="#111">MC / MC-C engines differ</text>
  <text x="35" y="378" font-size="12" fill="#555">Alpha lubricator driven from a separate</text>
  <text x="35" y="394" font-size="12" fill="#555">pump station; controlled by the ALCU</text>
  <text x="35" y="410" font-size="12" fill="#555">(replaced by ALCU 2R, SL2025-766).</text>
  <text x="35" y="426" font-size="12" fill="#555">Maintenance list includes accumulators,</text>
  <text x="35" y="442" font-size="12" fill="#555">solenoid valves, non-return valves and</text>
  <text x="35" y="458" font-size="12" fill="#555">feedback sensors (SL2016-632).</text>
  <text x="35" y="474" font-size="12" fill="#555">NOT part of the G95ME-C10.5-GI</text>
  <text x="35" y="490" font-size="12" fill="#555">installation.</text>
  <text x="20" y="670" font-size="11" fill="#555">Sources: Everllence project guide G95ME-C10.5-GI, 7020-0260-14ppr rev 1.0 (July 2026), 9.02 and Fig. 9.02.02c, GVA tags ZV 8281 / ZT 8282 (Alpha/ME) and XC 8288 / ZT 8289 (Alpha Mk 2);</text>
  <text x="20" y="686" font-size="11" fill="#555">MAN SL2023-737 App. I (part-load control); MAN Service Experience 2014 (Mk II injections); SL2016-632; SL2025-766.</text>
</svg>
