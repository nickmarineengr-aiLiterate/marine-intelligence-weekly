<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">QP2609 Q4 - D4: ACOM Mk III automated cylinder oil mixing system (Everllence B&amp;W, option)</title>
  <desc id="d">Simplified functional arrangement, illustrative; the maker's project guide gives the installation details. Low-BN and high-BN cylinder oils flow by gravity from their storage or service tanks, through an inlet valve, strainer and pressure indicator, into the ACOM Mk III unit: a low-BN oil tank and a high-BN oil tank, each heated and fitted with temperature and low-level monitoring. Each tank has a motor-driven pump whose discharge has a relief valve back to the same tank and then a motor-operated valve. The two dosing lines join at one junction and rise through one line into the BN mixing tank, which has a level transmitter, level alarm and temperature monitoring. A motor-driven circulation pump draws from that inlet line and returns oil into the mixing tank; a normally closed, motor-operated bypass valve connects the circulation-pump suction to the high-BN oil tank. The mixed oil leaves the mixing tank through a manual outlet valve inside the unit and an insulated, heat-traced pipe to engine inlet AC. The maker states that ACOM eliminates the need for two cylinder oil service/day tanks and for a heating tank. An electrical cabinet controlled by the engine control system sets the ordered BN. The maker's figure is drawn for dual-fuel engines with the Specified Dual Fuel (SDF) option.</desc>
