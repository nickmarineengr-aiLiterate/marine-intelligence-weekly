  <text x="20" y="690" font-size="11" fill="#555">Sources: Everllence project guide G95ME-C10.5-GI, 7020-0260-14ppr rev 1.0 (July 2026), section 9.01 (Option 2, Fig. 9.01.02, Fig. 9.01.04); Fig. 9.02.04a; MAN SL2023-737 (June 2023).</text>
  <text x="20" y="706" font-size="11" fill="#555">Maker: ACOM "eliminates the need for two cylinder oil service/day tanks" and the heating tank. Pump control law and bypass duty are not asserted.</text>
