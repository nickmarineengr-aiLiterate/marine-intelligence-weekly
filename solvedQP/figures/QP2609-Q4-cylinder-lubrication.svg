<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>QP2609 Q4 - Electronically timed cylinder lubrication system (generic schematic, not to scale)</title>
  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Q4 - Cylinder lubricating system, new-generation two-stroke engine (generic schematic, not to scale)</text>
  <text x="20" y="48" fill="#555">Layout per the verified answer (donor QP2402-Q4); accumulator placement shown generically. Maker example: MAN B&amp;W Alpha Lubricator. No settings shown.</text>

  <g stroke="#1b3a5c" stroke-width="2" fill="#eef3f8">
    <rect x="30" y="75" width="270" height="56" rx="6"/>
    <rect x="30" y="170" width="270" height="56" rx="6"/>
    <rect x="30" y="265" width="270" height="56" rx="6"/>
    <rect x="340" y="265" width="280" height="56" rx="6"/>
    <rect x="340" y="380" width="280" height="56" rx="6"/>
    <rect x="650" y="75" width="280" height="72" rx="6"/>
  </g>
  <g>
    <text x="42" y="98" font-weight="bold">1 Storage tank(s)</text><text x="42" y="118" fill="#555">more than one BN grade carried</text>
    <text x="42" y="193" font-weight="bold">2 Service (daily) tank</text><text x="42" y="213" fill="#555">heated; level alarm; low-level cut-out</text>
    <text x="42" y="288" font-weight="bold">3 Heater + filter</text><text x="42" y="308" fill="#555">viscosity; protects pump elements</text>
    <text x="352" y="288" font-weight="bold">4 Lubricator unit (one per cylinder)</text><text x="352" y="308" fill="#555">plunger elements, solenoid-controlled</text>
    <text x="352" y="403" font-weight="bold">5 Accumulator</text><text x="352" y="423" fill="#555">fitted with each lubricator unit (4)</text>
    <text x="662" y="98" font-weight="bold">7 Control unit</text><text x="662" y="118" fill="#555">inputs: crank angle, engine load, fuel S%</text><text x="662" y="136" fill="#555">(S% entered from the bunker delivery note)</text>
  </g>

  <g stroke="#1b3a5c" stroke-width="2" fill="none">
    <path d="M165 131 V170"/><path d="M158 162 L165 170 L172 162"/>
    <path d="M165 226 V265"/><path d="M158 257 L165 265 L172 257"/>
    <path d="M300 293 H340"/><path d="M332 286 L340 293 L332 300"/>
    <path d="M480 321 V380" stroke-dasharray="3 3"/>
    <path d="M620 305 H660 V345 H692"/><path d="M684 338 L692 345 L684 352"/>
  </g>
  <text x="628" y="370" font-size="12">HP</text>
  <text x="628" y="385" font-size="12">delivery</text>

  <g stroke="#b35900" stroke-width="1.6" stroke-dasharray="6 4" fill="none">
    <path d="M790 147 V235 H620 V265"/><path d="M613 257 L620 265 L627 257"/>
  </g>
  <text x="632" y="228" fill="#b35900" font-size="12">timing and dose command</text>

  <g stroke="#333" stroke-width="2" fill="none">
    <rect x="700" y="290" width="160" height="220"/>
    <rect x="715" y="320" width="130" height="60" fill="#dde6ee"/>
    <line x1="715" y1="335" x2="845" y2="335"/><line x1="715" y1="345" x2="845" y2="345"/><line x1="715" y1="355" x2="845" y2="355"/>
  </g>
  <g fill="#b30000"><circle cx="700" cy="345" r="6"/><circle cx="860" cy="345" r="6"/></g>
  <text x="712" y="310" font-size="12">cylinder liner (section)</text>
  <text x="730" y="400" font-size="12" fill="#555">piston + ring pack</text>
  <text x="870" y="330" font-size="12">6 Quills round</text>
  <text x="870" y="346" font-size="12">the liner at</text>
  <text x="870" y="362" font-size="12">ring-pack level,</text>
  <text x="870" y="378" font-size="12">each with a</text>
  <text x="870" y="394" font-size="12">non-return valve</text>
  <path d="M780 510 V525" stroke="#333" stroke-width="2"/>
  <text x="560" y="545" font-size="12">8 Scavenge space / drain - scrape-down samples (residual BN, iron)</text>

  <text x="30" y="470" font-size="12" fill="#1b3a5c">Principle: the dose is timed onto the ring pack as it passes the quills;</text>
  <text x="30" y="487" font-size="12" fill="#1b3a5c">alkali delivered = BN x feed rate, set to track the sulphur burnt;</text>
  <text x="30" y="504" font-size="12" fill="#1b3a5c">never below the maker's minimum feed rate; verify by scrape-down analysis.</text>
  <text x="30" y="521" font-size="12" fill="#1b3a5c">MAN ACC mode: feed rate set in proportion to fuel S% via the ACC factor.</text>
  <text x="20" y="590" font-size="11" fill="#555">Sources: donor QP2402-Q4 (layout); MAN Diesel &amp; Turbo SL2013-571 (ACC control); WinGD Pulse Jet uses its own control logic - do not transfer settings between makers.</text>
</svg>
