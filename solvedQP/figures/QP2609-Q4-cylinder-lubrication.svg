<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">QP2609 Q4 - D1: Cylinder lubricating oil system, Everllence B&amp;W G95ME-C10.5-GI (Alpha lubricators, ACOS2)</title>
  <desc id="d">Original line diagram. Two cylinder-oil tanks of different base number feed an ACOS2 three-way switching valve, then a filter and a cylinder oil heating tank, then an insulated electrically heat-traced pipe to engine inlet AC and the main supply valve. The main pipe on the engine feeds an Alpha lubricator on each hydraulic cylinder unit, which is actuated by 300 bar system oil. Lines run to several lubricating quills round each liner, each with a non-return valve. A cylinder control unit per cylinder commands the lubricator valve and reads its feedback sensor. Not to scale; no settings.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b3a5c"/></marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b35900"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker></defs>
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111">Q4 - D1  Cylinder lubricating oil system: Everllence B&amp;W G95ME-C10.5-GI (Alpha lubricators, ACOS2)</text>
  <text x="20" y="49" fill="#555">Original educational line diagram - not to scale, no settings. Traced to the maker's project guide Figs. 9.01.01, 9.02.02c and 9.02.04. Numbers match the Answer list.</text>
