  <rect x="25" y="725" width="420" height="150" rx="6" fill="#fff4e5" stroke="#b35900" stroke-width="2"/>
  <text x="35" y="745" font-weight="bold" fill="#111">Oil-supply layout drawn on the ship side</text>
  <text x="35" y="763" font-size="12" fill="#555">Single-inlet ACOS2 layout, PG Fig. 9.01.01 (all engines):</text>
  <text x="35" y="779" font-size="12" fill="#555">switching valve before one heating tank; one inlet AC.</text>
  <text x="35" y="795" font-size="12" fill="#555">GI engines - PG Figs. 9.02.02a and 9.02.04a also show</text>
  <text x="35" y="811" font-size="12" fill="#555">the ACOS valve ON THE ENGINE, behind AC1 (low BN) and</text>
  <text x="35" y="827" font-size="12" fill="#555">AC2 (high BN), with a filter and small heated tank per oil:</text>
  <text x="35" y="843" font-size="12" fill="#555">D3, arrangement B. With ACOM (SDF): one inlet AC (D4).</text>
  <text x="35" y="859" font-size="12" fill="#555">The two layouts are not combined.</text>
  <text x="470" y="668" font-size="12" fill="#555">7 = quills (red): three drawn, one feed line each - illustrative, not a count;</text>
  <text x="470" y="683" font-size="12" fill="#555">     the number and spacing depend on the engine type; each has a non-return valve.</text>
  <text x="470" y="698" font-size="12" fill="#555">Supply valve per lubricator: OPEN, or CLOSED = line vented + "non-flow cylinder oil" alarm.</text>
  <text x="470" y="713" font-size="12" fill="#555">LS = level switch on each lubricator's oil inlet (LS 8285).</text>
  <text x="470" y="728" font-size="12" fill="#555">Green = 300 bar system oil to each HCU; the lubricator is mounted on the HCU.</text>
  <text x="470" y="743" font-size="12" fill="#555">8 = CCU inputs: engine speed (tacho), fuel index; MOP settings; CCUs linked (dashed).</text>
  <text x="470" y="758" font-size="12" fill="#555">     Dashed = valve command (solenoid valve, Alpha/ME; proportional valve, Alpha Mk 2).</text>
  <text x="470" y="773" font-size="12" fill="#555">     Dotted = lubricator feedback sensor.</text>
  <text x="20" y="890" font-size="11" fill="#555">Sources: Everllence project guide G95ME-C10.5-GI, 7020-0260-14ppr rev 1.0 (July 2026) - s.9.01, 9.02 (Figs. 9.01.01, 9.02.02a, 9.02.02c, 9.02.04a); MAN SL2022-731; SL2023-737.</text>
  <text x="20" y="906" font-size="11" fill="#555">Oil enters through the non-return valves as the piston rings pass the quills on the upstroke, intermittently (e.g. every 2, 4 or 8 revolutions).</text>
