  <text x="560" y="462" font-size="12" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#2e7d32">300 bar system oil to each HCU - actuates the lubricator</text>
  <rect x="25" y="660" width="420" height="50" rx="6" fill="#f6f6f6" stroke="#333" stroke-width="2"/>
  <text x="35" y="680" font-weight="bold" fill="#111">9 Scavenge space / piston-underside drain</text>
  <text x="35" y="698" font-size="12" fill="#555">sample point for drain-oil analysis (residual BN, iron)</text>
  <text x="470" y="672" font-size="12" fill="#555">7  Several quills per liner, each with a non-return valve; count depends on engine type (six drawn).</text>
  <text x="470" y="688" font-size="12" fill="#555">8  CCU inputs: engine speed (tacho) and fuel index; settings from the MOP.</text>
  <text x="470" y="704" font-size="12" fill="#555">    Dashed = valve command (solenoid valve, Alpha/ME; proportional valve, Alpha Mk 2).</text>
  <text x="470" y="720" font-size="12" fill="#555">    Dotted = lubricator feedback sensor.</text>
  <text x="20" y="750" font-size="11" fill="#555">Sources: Everllence project guide G95ME-C10.5-GI, 7020-0260-14ppr rev 1.0 (July 2026) - sections 9.01 and 9.02 (Figs. 9.01.01, 9.02.02c, 9.02.04); MAN SL2023-737 (June 2023).</text>
  <text x="20" y="766" font-size="11" fill="#555">Oil enters through the non-return valves as the piston rings pass the quills on the upstroke, intermittently (e.g. every 2, 4 or 8 revolutions).</text>
