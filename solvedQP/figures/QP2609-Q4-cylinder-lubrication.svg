<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" font-family="Arial, Helvetica, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">QP2609 Q4 - D1: Cylinder lubricating oil system, Everllence B&amp;W G95ME-C10.5-GI (Alpha lubricators, ACOS2)</title>
  <desc id="d">Original line diagram. The bold numbers 1 to 9 are the item numbers of the Answer list, not quantities. Ship side, drawn in the single-inlet layout of the project guide, Fig. 9.01.01: two cylinder-oil tanks of different base number feed an ACOS2 three-way switching valve, then a filter and a cylinder oil heating tank, then an insulated electrically heat-traced pipe to engine inlet AC and the main cylinder oil pipe on the engine. For GI engines the same guide also shows the switching valve on the engine behind two inlets, AC1 for low BN and AC2 for high BN, each oil with its own filter and small heated tank; that layout is drawn in D3 as arrangement B and is not combined with this one. A branch from the main pipe feeds the Alpha lubricator of each cylinder through its own supply valve, open or closed; closed vents the line and gives the non-flow cylinder oil alarm. Each lubricator is mounted on the hydraulic cylinder unit, which is supplied with 300 bar system oil. Three lubricating quills are drawn round each liner, each fed by its own line and fitted with a non-return valve; this arrangement is illustrative, not a count - the number and spacing of the quills depend on the engine type. A cylinder control unit per cylinder commands the lubricator valve and reads its feedback sensor. Not to scale; no settings.</desc>
