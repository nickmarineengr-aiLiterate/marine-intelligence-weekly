<!DOCTYPE html>
<html lang="en">
<head>

<title>Your MIW Access — Marine Intelligence Weekly</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;
     font-family:'Segoe UI',system-ui,sans-serif;padding:1rem}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:2.25rem 1.75rem;
      width:100%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.logo{color:#0d9488;font-weight:700;font-size:1.1rem;margin-bottom:4px}
.subtitle{color:#64748b;font-size:13px;margin-bottom:1.75rem}
h2{color:#f1f5f9;font-size:1.2rem;margin-bottom:.4rem}
.desc{color:#94a3b8;font-size:13px;margin-bottom:1.25rem;line-height:1.6}
.field{margin-bottom:1rem}
label{display:block;color:#94a3b8;font-size:13px;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:#0f172a;border:1px solid #334155;border-radius:8px;
      color:#f1f5f9;font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.btn{width:100%;margin-top:.5rem;padding:13px;background:#0d9488;color:#fff;border:none;border-radius:8px;
     font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;text-align:center;
     text-decoration:none;display:block}
.btn:hover{background:#0f766e}
.btn:disabled{background:#334155;cursor:not-allowed;color:#64748b}
.btn.ghost{background:transparent;border:1px solid #334155;color:#cbd5e1}
.btn.ghost:hover{background:#0f172a;border-color:#0d9488;color:#fff}
.note{color:#f87171;font-size:13px;margin-top:10px;padding:10px 12px;background:rgba(248,113,113,.1);
      border-radius:6px;display:none}
.note.info{color:#fbbf24;background:rgba(251,191,36,.1)}
.divider{border:none;border-top:1px solid #334155;margin:1.5rem 0}
.help{color:#64748b;font-size:12px;text-align:center;line-height:1.8}
.help a{color:#0d9488;text-decoration:none}
.hidden{display:none}
/* ---- product hub ---- */
.who{color:#64748b;font-size:12.5px;margin-bottom:1.25rem;word-break:break-all}
.prod{border:1px solid #334155;border-radius:10px;padding:1rem 1.1rem;margin-bottom:.9rem;background:#0f172a}
.prod.owned{border-color:#0d9488}
.prod .row{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.prod h3{color:#f1f5f9;font-size:1rem;margin:0 0 .3rem}
.prod .tick{color:#34d399;font-weight:700;margin-right:5px}
.prod p{color:#94a3b8;font-size:12.5px;line-height:1.6;margin:0 0 .8rem}
.prod .price{color:#fbbf24;font-size:.95rem;font-weight:700;white-space:nowrap}
.prod.wanted{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.prod .flag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;
     text-transform:uppercase;color:#0d9488;margin-bottom:.35rem}
.prod .state{font-size:12.5px;line-height:1.6;margin:0 0 .8rem;color:#34d399}
.prod .state.ended{color:#94a3b8}
.prod .btn+.btn{margin-top:.5rem}
.spinner{color:#64748b;font-size:13px;text-align:center;padding:1.5rem 0}
@media(max-width:420px){.card{padding:1.75rem 1.25rem}}

</head>
<body>
<div class="card">
  <div class="logo">Marine Intelligence Weekly</div>
  <div class="subtitle">MEO Class I — your access</div>

  <!-- ================= LOADING ================= -->
  <div id="panel-loading"><div class="spinner">Checking your access…</div></div>

  <!-- ================= LOGIN ================= -->
  <div id="panel-login" class="hidden">
    <h2>Sign in</h2>
    <p class="desc">Use the email you purchased with and the password from your MIW purchase email.</p>
    <div class="field">
      <label for="login-email">Email address</label>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="login-pwd">Password</label>
      <!-- Placeholder shows the CURRENT credential shape. Passwords are
           no longer drawn from the MIW-xxxxxxxx pool; they are generated
           per account, 16 characters, no ambiguous letters or digits. -->
      <input type="password" id="login-pwd" placeholder="16-character password" autocomplete="current-password">
    </div>
    <div class="note" id="login-msg"></div>
    <button class="btn" id="login-btn">Sign in →</button>
    <hr class="divider">
    <div class="help">
      Forgotten your password? <a href="#" id="reset-link">Email me a new one</a><br>
      Don't have access yet? <a href="/SQ/">See what's available →</a>
    </div>
  </div>

  <!-- ================= PRODUCT HUB ================= -->
  <div id="panel-hub" class="hidden">
    <h2>Your MIW access</h2>
    <div class="who" id="hub-who"></div>
    <div class="note info hidden" id="hub-msg"></div>
    <div id="hub-products"></div>
    <hr class="divider">
    <div class="help">
      <a href="#" id="logout">Sign out</a> ·
      <a href="mailto:contactus@marineintelligenceweekly.com">Support</a>
    </div>
  </div>
</div>

<script>
// -------------------------------------------------------------
// AUTHORITY NOTE
//
// This page decides NOTHING about access. It asks /api/session what
// the server says the account owns, and renders that.
//
// The previous version stored {email, pwd, expiry} in localStorage —
// the raw password, in cleartext, on the device — and treated an
// unexpired local record as proof of login. Neither the password nor
// any "am I logged in" flag is kept here now. The only client-side
// state is a device id used for the existing single-device bookkeeping.
//
// The real credential is the HttpOnly miw_session cookie, which this
// script cannot read, and which Edge middleware verifies before any
// paid byte is served.
// -------------------------------------------------------------

const PRODUCTS = {
  ORAL_QB_NOTES: {
    name: "Oral QB + Notes",
    blurb: "682 solved oral questions, examiner index and the full notes series.",
    open: "/meoclass1/",
    buy: "/SQ/#pricing-section",
    trial: "/SQ/trial.html?product=ORAL_QB_NOTES",
    price: "₹1,499",
    cta: "View Oral product",
  },
  SOLVED_QP: {
    name: "Solved Question Papers",
    blurb: "Complete solved Written papers — Understand, Exam Plan, Answer, Study Guide, Recall.",
    open: "/solvedQP/",
    buy: "/SQ/#solved-qp",
    trial: "/SQ/trial.html?product=SOLVED_QP",
    price: "₹1,500",
    cta: "View Written product",
  },
};

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const nextPath = params.get("next");

function show(panel) {
  for (const p of ["loading", "login", "hub"]) {
    $("panel-" + p).classList.toggle("hidden", p !== panel);
  }
}

function msg(text, kind) {
  const el = $("login-msg");
  el.textContent = text;
  el.className = "note" + (kind === "info" ? " info" : "");
  el.style.display = text ? "block" : "none";
}

function getDeviceId() {
  let id = localStorage.getItem("miw_device_id");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID()
      : "dev-" + Date.now() + "-" + Math.random().toString(36).slice(2));
    localStorage.setItem("miw_device_id", id);
  }
  return id;
}

// Explain why middleware sent them here, rather than looking broken.
const REASONS = {
  nosession: "Please sign in to open that page.",
  evicted: "You were signed out because this account signed in on another device.",
  noentitlement: "Your account doesn't include that product yet.",
  trialexpired: "Your free trial of that product has ended.",
  expired: "Your access to that product has ended. You can renew it below.",
  misconfigured: "Access is temporarily unavailable. Please contact support.",
  authstore: "Access is temporarily unavailable. Please try again shortly.",
};

/** Which product does a bounced path belong to? */
function productForPath(path) {
  if (!path) return null;
  if (/^\/solvedQP\//.test(path) || /^\/meoclass1\/pastpapers\//.test(path)) return "SOLVED_QP";
  if (/^\/meoclass1\//.test(path)) return "ORAL_QB_NOTES";
  return null;
}

/**
 * "11h 58m left" — computed once from the SERVER's expiry timestamp and
 * rendered as plain text. Deliberately not a ticking countdown: the
 * remaining time is information the candidate asked for, not pressure
 * to act, and the browser's clock has no authority over access anyway.
 */
/** A server expiry rendered in the reader's own locale. */
function accessDate(epochSeconds) {
  if (!epochSeconds) return "";
  try {
    return new Date(epochSeconds * 1000).toLocaleDateString(undefined,
      { day: "numeric", month: "long", year: "numeric" });
  } catch (_) { return ""; }
}

/** Bought once, term run out. Distinct from never having bought. */
function accessLapsed(session, key) {
  return (((session.access || {})[key] || {}).status === "expired");
}

function remainingText(seconds) {
  if (!(seconds > 0)) return "";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + "h " + m + "m left";
  if (m > 0) return m + "m left";
  return "under a minute left";
}

/**
 * Name the product they were reaching for, so the notice says what they
 * hit rather than only that they were stopped. The product card directly
 * underneath already carries the price and the buy link, so this needs to
 * point, not to sell.
 */
function wantedSuffix(path) {
  const key = productForPath(path);
  return key ? " That page is part of " + PRODUCTS[key].name + " — see below." : "";
}

/**
 * Render the access hub.
 *
 * WHAT THIS PAGE WILL NOT DO: choose a product for the candidate.
 *
 * It used to. If a signed-in customer was bounced from a page they
 * were in fact entitled to, boot() called location.replace(next) and
 * threw them straight into it. With a saved password in Chrome the
 * whole gate could flash past in well under a second, so a candidate
 * who came here to look at the OTHER product, or to check what their
 * account holds, found themselves inside a product they had not asked
 * to open and had to navigate back out of.
 *
 * Signing in proves WHO you are. It does not decide WHERE you go.
 * `next` is now used only to highlight the card the candidate was
 * reaching for; opening it is always an explicit click.
 */
function renderHub(session) {
  $("hub-who").textContent = "Signed in as " + session.email;
  const owned = session.entitlements || {};
  const offers = session.offers || {};
  const wanted = productForPath(nextPath);
  const box = $("hub-products");
  box.innerHTML = "";

  // The product they were reaching for comes first, then owned ones,
  // then the cross-sell. Owning one product must never imply the other —
  // they are separate purchases and separate grants.
  const rank = (k) => (k === wanted ? 2 : 0) + (owned[k] ? 1 : 0);
  const order = Object.keys(PRODUCTS).sort((a, b) => rank(b) - rank(a));

  for (const key of order) {
    const p = PRODUCTS[key];
    const has = owned[key] === true;
    const offer = offers[key] || {};
    const onTrial = !has && offer.status === "active";

    const el = document.createElement("div");
    el.className = "prod" + (has || onTrial ? " owned" : "") + (key === wanted ? " wanted" : "");

    let html = "";
    if (key === wanted) html += '<span class="flag">You were opening this</span>';
    html += '<div class="row"><h3>' + (has || onTrial ? '<span class="tick">✓</span>' : "") +
            p.name + "</h3>" +
            (has || onTrial ? "" : '<span class="price">' + p.price + "</span>") + "</div>";
    html += "<p>" + p.blurb + "</p>";

    if (has) {
      // STATE A — owned. Say WHICH kind of access they hold, because
      // there are now two and the difference matters to them: a
      // Candidate-Lifecycle access from an earlier purchase, or a dated
      // term with a renewal date. Both are read from the server; neither
      // is inferred here.
      const a = (session.access || {})[key] || {};
      // `perpetual` is the TECHNICAL shape — no clock-based expiry — and
      // the customer-facing name for what it buys is Candidate-Lifecycle
      // Access. The two are not the same claim, and the internal word
      // must not be the one the member reads: "lifetime" over-promises
      // and "perpetual" is jargon. Terms §3 carries the full definition.
      if (a.perpetual) {
        html += '<p class="state">Candidate-Lifecycle Access — your original access remains active.</p>';
      } else if (a.expires) {
        html += '<p class="state">Access until ' + accessDate(a.expires) + "</p>";
      }
      html += '<a class="btn" href="' + p.open + '">Open →</a>';
    } else if (accessLapsed(session, key)) {
      // Paid once, term run out. A renewal, not a first-time pitch.
      html += '<p class="state ended">Your access ended on ' +
              accessDate(((session.access || {})[key] || {}).expires) + ".</p>" +
              '<a class="btn" href="' + p.buy + '">Renew access ' + p.price + " →</a>";
    } else if (onTrial) {
      // STATE D — trial running. Access is real, so the primary action
      // is to use it; buying is offered second, not pushed.
      html += '<p class="state">Free trial active — ' +
              remainingText(offer.secondsRemaining) + "</p>" +
              '<a class="btn" href="' + p.open + '">Open →</a>' +
              '<a class="btn ghost" href="' + p.buy + '">Get one-year access ' + p.price + " →</a>";
    } else if (offer.status === "expired") {
      // STATE E/F — trial spent. Say so plainly and move on.
      html += '<p class="state ended">Your free trial has ended.</p>' +
              '<a class="btn" href="' + p.buy + '">' + p.cta + " →</a>";
    } else if (offer.status === "available") {
      // STATE B/C — trial still there for the taking. The trial page
      // owns the offer copy and the Independence Day banner; this is a
      // link to it, not a second place the clock could start.
      html += '<a class="btn ghost" href="' + p.buy + '">' + p.cta + " →</a>" +
              '<a class="btn ghost" href="' + p.trial + '">Try free' +
              (offer.offerHours ? " for " + offer.offerHours + " hours" : "") + " →</a>";
    } else {
      // Trial state unavailable (e.g. /api/trial unreachable). Degrade
      // to the plain buy path rather than guess at an offer.
      html += '<a class="btn ghost" href="' + p.buy + '">' + p.cta + " →</a>";
    }

    el.innerHTML = html;
    box.appendChild(el);
  }

  // Owning nothing is a legitimate state — a trial candidate is here
  // too — so this explains the just-purchased case without implying
  // the account is broken.
  if (!Object.values(owned).some(Boolean)) {
    const el = document.createElement("p");
    el.className = "desc";
    el.textContent = "If you have just purchased, give it a minute and refresh.";
    box.appendChild(el);
  }
}

/**
 * Ask the server who this is and what they hold.
 *
 * /api/trial answers identity, entitlements AND trial state in one
 * round trip, all from the same authoritative store /api/session reads.
 * If it cannot be reached we fall back to /api/session so the hub still
 * renders owned products — a trial outage must not lock a paying
 * customer out of their own access page.
 *
 * This function NAVIGATES NOWHERE. That is the point.
 */
async function loadAccess() {
  try {
    const r = await fetch("/api/trial", { credentials: "same-origin" });
    const s = await r.json();
    if (s && s.authenticated) return s;
    if (s && s.authenticated === false) return null;
  } catch (_) { /* fall through to the identity-only endpoint */ }

  try {
    const r = await fetch("/api/session", { credentials: "same-origin" });
    const s = await r.json();
    return s && s.authenticated ? s : null;
  } catch (_) {
    return null;
  }
}

async function doLogin() {
  const email = $("login-email").value.trim().toLowerCase();
  const pwd = $("login-pwd").value.trim();
  const btn = $("login-btn");
  msg("");

  if (!email || !pwd) return msg("Please enter both email and password.");

  btn.disabled = true;
  btn.textContent = "Checking…";
  try {
    const r = await fetch("/api/check-password", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: pwd, device_id: getDeviceId() }),
    });
    const data = await r.json();

    if (!data.success) {
      msg("Incorrect email or password. Check your purchase email from Marine Intelligence Weekly.");
      btn.disabled = false;
      btn.textContent = "Sign in →";
      return;
    }

    // The session cookie is set by the server. Nothing is stored here.
    //
    // Signing in lands on the hub — ALWAYS. Even when `next` names a
    // page this account can open, the candidate chooses to open it.
    const s = await loadAccess();
    if (s && s.authenticated) {
      renderHub(s);
      show("hub");
    } else {
      msg("Signed in, but the session could not be read. Please refresh.");
      btn.disabled = false;
      btn.textContent = "Sign in →";
    }
  } catch (e) {
    msg("Connection error. Please try again.");
    btn.disabled = false;
    btn.textContent = "Sign in →";
  }
}

/**
 * Forgotten password.
 *
 * This ISSUES A NEW PASSWORD — it cannot resend the existing one,
 * because the stored form is a salted hash and the plaintext exists
 * nowhere. The button text says "Email me a new one" for that reason;
 * "send my password" would be a promise the system cannot keep.
 *
 * The server answers identically whether or not the address has an
 * account, so this handler must not branch on the outcome either — the
 * UI would otherwise leak exactly what the endpoint refuses to.
 */
async function doReset(e) {
  e.preventDefault();
  const email = $("login-email").value.trim().toLowerCase();
  if (!email) {
    msg("Enter your email address above first, then tap the link.", "info");
    $("login-email").focus();
    return;
  }

  const link = $("reset-link");
  link.textContent = "Sending…";
  link.style.pointerEvents = "none";
  try {
    const r = await fetch("/api/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const d = await r.json();
    msg(d.message || "If that address has an account, a new password has been emailed to it.", "info");
  } catch {
    // Even a network failure gets the neutral line. A distinguishable
    // error here would be a second way to probe the same question.
    msg("If that address has an account, a new password has been emailed to it.", "info");
  } finally {
    link.textContent = "Email me a new one";
    link.style.pointerEvents = "";
  }
}

$("reset-link").addEventListener("click", doReset);
$("login-btn").addEventListener("click", doLogin);
for (const id of ["login-email", "login-pwd"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}

$("logout").addEventListener("click", async (e) => {
  e.preventDefault();
  try {
    await fetch("/api/session", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "logout" }),
    });
  } catch (_) { /* clearing the cookie is the server's job; ignore */ }
  location.replace("/SQ/pay.html");
});

// ---- boot ----
(async () => {
  // Clear the old cleartext-password record if this browser still has one.
  try { localStorage.removeItem("miw_auth"); } catch (_) {}

  const s = await loadAccess();
  const reason = params.get("reason");

  if (s && s.authenticated) {
    renderHub(s);
    // A signed-in customer bounced off a product they do not own used to
    // land here with NO explanation — the reason string existed but was
    // only rendered on the login panel, which they never see. Being
    // silently teleported reads as a broken link, not as a locked door.
    if (reason && REASONS[reason]) {
      const el = $("hub-msg");
      el.textContent = REASONS[reason] + wantedSuffix(nextPath);
      el.classList.remove("hidden");
    }
    show("hub");
  } else {
    if (reason && REASONS[reason]) msg(REASONS[reason], "info");
    show("login");
    $("login-email").focus();
  }
})();
</script>
</body>
</html>
