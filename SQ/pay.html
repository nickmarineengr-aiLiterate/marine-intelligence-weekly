<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Your MIW Access — Marine Intelligence Weekly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;
     font-family:'Segoe UI',system-ui,sans-serif;padding:1rem}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:2.25rem 1.75rem;
      width:100%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.logo{color:#0d9488;font-weight:700;font-size:1.1rem;margin-bottom:4px}
.subtitle{color:#64748b;font-size:13px;margin-bottom:1.75rem}
h2{color:#f1f5f9;font-size:1.2rem;margin-bottom:.4rem}
.desc{color:#94a3b8;font-size:13px;margin-bottom:1.25rem;line-height:1.6}
.field{margin-bottom:1rem}
label{display:block;color:#94a3b8;font-size:13px;margin-bottom:6px}
input{width:100%;padding:12px 14px;background:#0f172a;border:1px solid #334155;border-radius:8px;
      color:#f1f5f9;font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.btn{width:100%;margin-top:.5rem;padding:13px;background:#0d9488;color:#fff;border:none;border-radius:8px;
     font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;text-align:center;
     text-decoration:none;display:block}
.btn:hover{background:#0f766e}
.btn:disabled{background:#334155;cursor:not-allowed;color:#64748b}
.btn.ghost{background:transparent;border:1px solid #334155;color:#cbd5e1}
.btn.ghost:hover{background:#0f172a;border-color:#0d9488;color:#fff}
.note{color:#f87171;font-size:13px;margin-top:10px;padding:10px 12px;background:rgba(248,113,113,.1);
      border-radius:6px;display:none}
.note.info{color:#fbbf24;background:rgba(251,191,36,.1)}
.divider{border:none;border-top:1px solid #334155;margin:1.5rem 0}
.help{color:#64748b;font-size:12px;text-align:center;line-height:1.8}
.help a{color:#0d9488;text-decoration:none}
.hidden{display:none}
/* ---- product hub ---- */
.who{color:#64748b;font-size:12.5px;margin-bottom:1.25rem;word-break:break-all}
.prod{border:1px solid #334155;border-radius:10px;padding:1rem 1.1rem;margin-bottom:.9rem;background:#0f172a}
.prod.owned{border-color:#0d9488}
.prod .row{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.prod h3{color:#f1f5f9;font-size:1rem;margin:0 0 .3rem}
.prod .tick{color:#34d399;font-weight:700;margin-right:5px}
.prod p{color:#94a3b8;font-size:12.5px;line-height:1.6;margin:0 0 .8rem}
.prod .price{color:#fbbf24;font-size:.95rem;font-weight:700;white-space:nowrap}
.spinner{color:#64748b;font-size:13px;text-align:center;padding:1.5rem 0}
@media(max-width:420px){.card{padding:1.75rem 1.25rem}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Marine Intelligence Weekly</div>
  <div class="subtitle">MEO Class I — your access</div>

  <!-- ================= LOADING ================= -->
  <div id="panel-loading"><div class="spinner">Checking your access…</div></div>

  <!-- ================= LOGIN ================= -->
  <div id="panel-login" class="hidden">
    <h2>Sign in</h2>
    <p class="desc">Use the email you purchased with and the password from your MIW purchase email.</p>
    <div class="field">
      <label for="login-email">Email address</label>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="login-pwd">Password</label>
      <input type="password" id="login-pwd" placeholder="MIW-xxxxxxxx" autocomplete="current-password">
    </div>
    <div class="note" id="login-msg"></div>
    <button class="btn" id="login-btn">Sign in →</button>
    <hr class="divider">
    <div class="help">
      Lost your password? <a href="mailto:contactus@marineintelligenceweekly.com">Email us</a><br>
      Don't have access yet? <a href="/SQ/">See what's available →</a>
    </div>
  </div>

  <!-- ================= PRODUCT HUB ================= -->
  <div id="panel-hub" class="hidden">
    <h2>Your MIW access</h2>
    <div class="who" id="hub-who"></div>
    <div class="note info hidden" id="hub-msg"></div>
    <div id="hub-products"></div>
    <hr class="divider">
    <div class="help">
      <a href="#" id="logout">Sign out</a> ·
      <a href="mailto:contactus@marineintelligenceweekly.com">Support</a>
    </div>
  </div>
</div>

<script>
// -------------------------------------------------------------
// AUTHORITY NOTE
//
// This page decides NOTHING about access. It asks /api/session what
// the server says the account owns, and renders that.
//
// The previous version stored {email, pwd, expiry} in localStorage —
// the raw password, in cleartext, on the device — and treated an
// unexpired local record as proof of login. Neither the password nor
// any "am I logged in" flag is kept here now. The only client-side
// state is a device id used for the existing single-device bookkeeping.
//
// The real credential is the HttpOnly miw_session cookie, which this
// script cannot read, and which Edge middleware verifies before any
// paid byte is served.
// -------------------------------------------------------------

const PRODUCTS = {
  ORAL_QB_NOTES: {
    name: "Oral QB + Notes",
    blurb: "417+ solved oral questions, examiner index and the full notes series.",
    open: "/meoclass1/",
    buy: "/SQ/#pricing",
    price: "₹1,499",
    cta: "View Oral product",
  },
  SOLVED_QP: {
    name: "Solved Question Papers",
    blurb: "Complete solved Written papers — Understand, Exam Plan, Answer, Study Guide, Recall.",
    open: "/solvedQP/",
    buy: "/SQ/#solved-qp",
    price: "₹1,500",
    cta: "View Written product",
  },
};

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const nextPath = params.get("next");

function show(panel) {
  for (const p of ["loading", "login", "hub"]) {
    $("panel-" + p).classList.toggle("hidden", p !== panel);
  }
}

function msg(text, kind) {
  const el = $("login-msg");
  el.textContent = text;
  el.className = "note" + (kind === "info" ? " info" : "");
  el.style.display = text ? "block" : "none";
}

function getDeviceId() {
  let id = localStorage.getItem("miw_device_id");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID()
      : "dev-" + Date.now() + "-" + Math.random().toString(36).slice(2));
    localStorage.setItem("miw_device_id", id);
  }
  return id;
}

// Explain why middleware sent them here, rather than looking broken.
const REASONS = {
  nosession: "Please sign in to open that page.",
  evicted: "You were signed out because this account signed in on another device.",
  noentitlement: "Your account doesn't include that product yet.",
  misconfigured: "Access is temporarily unavailable. Please contact support.",
  authstore: "Access is temporarily unavailable. Please try again shortly.",
};

/**
 * Name the product they were reaching for, so the notice says what they
 * hit rather than only that they were stopped. The product card directly
 * underneath already carries the price and the buy link, so this needs to
 * point, not to sell.
 */
function wantedSuffix(path) {
  if (!path) return "";
  const key = /^\/solvedQP\//.test(path) || /^\/meoclass1\/pastpapers\//.test(path)
    ? "SOLVED_QP"
    : /^\/meoclass1\//.test(path) ? "ORAL_QB_NOTES" : null;
  return key ? " That page is part of " + PRODUCTS[key].name + " — see below." : "";
}

function renderHub(session) {
  $("hub-who").textContent = "Signed in as " + session.email;
  const owned = session.entitlements || {};
  const box = $("hub-products");
  box.innerHTML = "";

  // Owned first, then the cross-sell. Owning one product must never
  // imply the other — they are separate purchases and separate grants.
  const order = Object.keys(PRODUCTS).sort((a, b) => (owned[b] ? 1 : 0) - (owned[a] ? 1 : 0));

  for (const key of order) {
    const p = PRODUCTS[key];
    const has = owned[key] === true;
    const el = document.createElement("div");
    el.className = "prod" + (has ? " owned" : "");
    el.innerHTML =
      '<div class="row"><h3>' + (has ? '<span class="tick">✓</span>' : "") + p.name + "</h3>" +
      (has ? "" : '<span class="price">' + p.price + "</span>") + "</div>" +
      "<p>" + p.blurb + "</p>" +
      '<a class="btn' + (has ? "" : " ghost") + '" href="' + (has ? p.open : p.buy) + '">' +
      (has ? "Open" : p.cta) + " →</a>";
    box.appendChild(el);
  }

  if (!Object.values(owned).some(Boolean)) {
    const el = document.createElement("p");
    el.className = "desc";
    el.textContent = "No products are attached to this account yet. " +
      "If you have just purchased, give it a minute and refresh.";
    box.prepend(el);
  }
}

async function loadSession({ redirectIfAllowed } = {}) {
  try {
    const r = await fetch("/api/session", { credentials: "same-origin" });
    const s = await r.json();
    if (!s.authenticated) return null;

    // If middleware bounced them from a specific page and they are now
    // entitled to it, send them straight back rather than making them
    // navigate again.
    if (redirectIfAllowed && nextPath && /^\/(meoclass1|solvedQP)\//.test(nextPath)) {
      const need = nextPath.startsWith("/solvedQP/") ? "SOLVED_QP"
        : nextPath.startsWith("/meoclass1/pastpapers/") ? "SOLVED_QP" : "ORAL_QB_NOTES";
      if (s.entitlements && s.entitlements[need]) {
        location.replace(nextPath);
        return s;
      }
    }
    return s;
  } catch (e) {
    return null;
  }
}

async function doLogin() {
  const email = $("login-email").value.trim().toLowerCase();
  const pwd = $("login-pwd").value.trim();
  const btn = $("login-btn");
  msg("");

  if (!email || !pwd) return msg("Please enter both email and password.");

  btn.disabled = true;
  btn.textContent = "Checking…";
  try {
    const r = await fetch("/api/check-password", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: pwd, device_id: getDeviceId() }),
    });
    const data = await r.json();

    if (!data.success) {
      msg("Incorrect email or password. Check your purchase email from Marine Intelligence Weekly.");
      btn.disabled = false;
      btn.textContent = "Sign in →";
      return;
    }

    // The session cookie is set by the server. Nothing is stored here.
    const s = await loadSession({ redirectIfAllowed: true });
    if (s && s.authenticated) {
      renderHub(s);
      show("hub");
    } else {
      msg("Signed in, but the session could not be read. Please refresh.");
      btn.disabled = false;
      btn.textContent = "Sign in →";
    }
  } catch (e) {
    msg("Connection error. Please try again.");
    btn.disabled = false;
    btn.textContent = "Sign in →";
  }
}

$("login-btn").addEventListener("click", doLogin);
for (const id of ["login-email", "login-pwd"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}

$("logout").addEventListener("click", async (e) => {
  e.preventDefault();
  try {
    await fetch("/api/session", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "logout" }),
    });
  } catch (_) { /* clearing the cookie is the server's job; ignore */ }
  location.replace("/SQ/pay.html");
});

// ---- boot ----
(async () => {
  // Clear the old cleartext-password record if this browser still has one.
  try { localStorage.removeItem("miw_auth"); } catch (_) {}

  const s = await loadSession({ redirectIfAllowed: true });
  const reason = params.get("reason");

  if (s && s.authenticated) {
    renderHub(s);
    // A signed-in customer bounced off a product they do not own used to
    // land here with NO explanation — the reason string existed but was
    // only rendered on the login panel, which they never see. Being
    // silently teleported reads as a broken link, not as a locked door.
    if (reason && REASONS[reason]) {
      const el = $("hub-msg");
      el.textContent = REASONS[reason] + wantedSuffix(nextPath);
      el.classList.remove("hidden");
    }
    show("hub");
  } else {
    if (reason && REASONS[reason]) msg(REASONS[reason], "info");
    show("login");
    $("login-email").focus();
  }
})();
</script>
</body>
</html>
